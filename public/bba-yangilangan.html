async function login(){const u=$('#u').value.trim(),p=$('#p').value,e=$('#er'),bt=$('.login-submit');e.textContent='';bt.classList.add('busy');const bad=m=>{e.textContent=m;bt.classList.remove('busy');bt.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350})};try{const d=await api({a:'login',u,p});if(u=='admin'){if(!d.admin)return bad("Login yoki parol noto'g'ri");DB=d.db;S={v:'admin',tab:'home',ad:{u,p}};return render()}if(d.error)return bad("Login yoki parol noto'g'ri");enterSt(u,p,d)}catch(x){bad('Internet aloqasini tekshiring')}}

function hist(g){if(!g.length)return '<p class=m>Natija yo‘q</p>';const mx=Math.max(...g.map(r=>r.tn||0),1),c=Array(mx+1).fill(0);g.forEach(r=>c[Math.max(0,Math.min(r.c|0,mx))]++);const top=Math.max(...c,1),W=640,H=240,L=36,B=36,bw=(W-L-10)/(mx+1),m=g.reduce((s,r)=>s+(r.c||0),0)/g.length,x=v=>L+v*bw+bw/2,y=v=>H-B-v/top*(H-B-24),st=Math.max(1,Math.ceil((mx+1)/12));return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:700px">${[0,.5,1].map(t=>`<line x1=${L} x2=${W-10} y1=${y(top*t)} y2=${y(top*t)} stroke="#e2e8f0"/><text x=${L-6} y=${y(top*t)+4} font-size=10 text-anchor=end fill="#64748b">${Math.round(top*t)}</text>`).join('')}${c.map((v,i)=>v?`<rect x=${L+i*bw+1} y=${y(v)} width=${Math.max(bw-2,1)} height=${H-B-y(v)} rx=3 fill="#1d4ed8"><title>${i} ta to‘g‘ri: ${v} o‘quvchi</title></rect><text x=${x(i)} y=${y(v)-4} font-size=10 text-anchor=middle fill="#1e3a8a">${v}</text>`:'').join('')}<line x1=${L} y1=${H-B} x2=${W-10} y2=${H-B} stroke="#64748b"/>${c.map((_,i)=>i%st==0?`<text x=${x(i)} y=${H-B+14} font-size=10 text-anchor=middle fill="#475569">${i}</text>`:'').join('')}<line x1=${x(m)} x2=${x(m)} y1=14 y2=${H-B} stroke="#f59e0b" stroke-width=2 stroke-dasharray="4 3"/><text x=${x(m)+4} y=12 font-size=11 fill="#b45309">o‘rtacha ${m.toFixed(1)}</text><text x=${W/2} y=${H-4} font-size=12 text-anchor=middle fill="#475569">To‘g‘ri javoblar soni (gorizontal) · o‘quvchilar soni (vertikal) · jami ${g.length} o‘quvchi</text></svg>`}
function qan(g){const R=g.filter(r=>Array.isArray(r.qa));if(!R.length)return '<p class=m>Tahlil uchun yangi natijalar kerak (savollar bo‘yicha ma’lumot shu yangilanishdan keyin yig‘iladi).</p>';const n=Math.max(...R.map(r=>r.qa.length)),Q=[];for(let i=0;i<n;i++){let t=0,w=0,e=0;R.forEach(r=>{const v=r.qa[i];if(v===null||v===undefined)return;t++;if(v===0)w++;if(v===-1)e++});if(t)Q.push({i,t,w,e,p:Math.round((w+e)/t*100),q:(R.find(r=>r.qt&&r.qt[i])||{qt:[]}).qt[i]||''})}if(!Q.length)return '<p class=m>Test savollari yo‘q.</p>';const S2=[...Q].sort((a,b)=>b.p-a.p||a.i-b.i),avg=Math.round(Q.reduce((s,q)=>s+q.p,0)/Q.length),col=p=>p>=60?'#dc2626':p>=35?'#f59e0b':'#16a34a';return `<p class=m>O‘rtacha xato darajasi: <b>${avg}%</b>. Eng qiyin savollar: ${S2.slice(0,5).map(q=>`<b>${q.i+1}-savol</b> (${q.p}%)`).join(', ')}.</p>${S2.map(q=>`<div class=qb><b>${q.i+1}-savol</b><div class=bar><i style="width:${q.p}%;background:${col(q.p)}"></i></div><span><b>${q.p}%</b></span>${q.q?`<div class=qt>${esc(q.q)} — xato: ${q.w}, javobsiz: ${q.e}, jami: ${q.t}</div>`:''}</div>`).join('')}`}

const LET={A:0,B:1,C:2,D:3,E:4,'А':0,'Б':1,'В':2,'Г':3,'Д':4};
const NT=35,NW=10;
function dr(){if(!DB.draft||!DB.draft.sl||DB.draft.sl.length!=NT+NW)DB.draft={fan:'',sl:Array.from({length:NT+NW},()=>({t:'',a:''}))};return DB.draft}
function slot(i){const d=dr().sl[i],t=(d.t||'').trim();if(!t)return null;if(i>=NT)return{t:'y',q:t.replace(/^\d+\s*[\.\)\-]\s*/,''),o:[],a:null};const c=parseSlot(t);if(!c.q&&!c.o.length)return null;let a=d.a!==''?+d.a:c.a;if(a!==null&&a>=c.o.length)a=null;return{t:c.o.length>=2?'t':'y',q:c.q,o:c.o,a,fb:c.fb,nl:t.split(/\n+/).filter(x=>x.trim()).length}}

const OPTR=/^([A-EА-ГДa-eа-гд])(?:\s*[\)\.\]:]|\t)\s*(.*)$/,ANSR=/^(?:javob|to'?g'?ri javob|answer|жавоб|тўғри жавоб|тугри жавоб|ответ)\s*(?:[:\-\u2013]\s*([A-EА-ГДa-eа-гд])|\s+([A-EА-ГДa-eа-гд])\s*[\)\.]?\s*$)/i,LTR='A-EА-ГДa-eа-гд';
function parseSlot(t){const L=t.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean);let q=[],o=[],a=null,m;
for(let l of L){if(m=l.match(ANSR)){a=LET[(m[1]||m[2]).toUpperCase()];continue}
let star=false;if(new RegExp('^[*+]\\s*['+LTR+']\\s*[\\)\\.\\]]').test(l)){star=true;l=l.replace(/^[*+]\s*/,'')}
m=l.match(OPTR);if(m&&LET[m[1].toUpperCase()]===o.length){let v=m[2];if(/^[*+]/.test(v)){star=true;v=v.slice(1).trim()}if(star)a=o.length;o.push(v);continue}
if(o.length)o[o.length-1]+=' '+l;else q.push(l)}
if(o.length<2){const full=L.filter(l=>!ANSR.test(l)).join(' '),re=/(?:^|\s)([A-DА-Г])\s*[\)\.]\s*/g,pos=[];let mm,exp=0;while(mm=re.exec(full)){if(LET[mm[1].toUpperCase()]===exp){pos.push({i:mm.index,e:re.lastIndex});exp++}}
if(pos.length>=2){q=[full.slice(0,pos[0].i).trim()];o=pos.map((x,k)=>full.slice(x.e,k+1<pos.length?pos[k+1].i:full.length).trim())}}
let fb=false;if(o.length<2){const L2=L.filter(l=>!ANSR.test(l));if(L2.length>=5){const tail=L2.slice(-4);q=L2.slice(0,-4);o=tail.map((l,k)=>{if(/^[*+]/.test(l)){a=k;l=l.slice(1).trim()}return l.replace(/^[A-EА-ГДa-eа-гд]\s*[\)\.\]:]\s*/,'').replace(/^[A-EА-ГДa-eа-гд]\t\s*/,'')});fb=true}}

function parse(t,mode){
const L=t.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean),o=[];let c=null,m;
const OPT=/^([A-EА-ГДa-eа-гд])\s*[\)\.\]]\s*(.*)$/,ANS=/^(?:javob|javob|to'?g'?ri javob|answer|жавоб|тўғри жавоб|тугри жавоб|ответ)\s*[:\-\u2013]\s*([A-EА-ГДa-eа-гд])/i,NUM=/^\d+\s*[\.\)\-]\s*(.+)$/;
if(mode=='y'){const nm=L.some(l=>NUM.test(l));for(const l of L){if(m=l.match(NUM))o.push({q:m[1],o:[],a:null,t:'y'});else if(nm&&o.length)o[o.length-1].q+=' '+l;else o.push({q:l,o:[],a:null,t:'y'})}return o}
for(let l of L){
if(m=l.match(ANS)){if(c)c.a=LET[m[1].toUpperCase()];continue}
let star=false;if(/^[*+]\s*[A-EА-ГДa-eа-гд]\s*[\)\.\]]/.test(l)){star=true;l=l.replace(/^[*+]\s*/,'')}
if(c&&(m=l.match(OPT))){let v=m[2];if(/^[*+]/.test(v)){star=true;v=v.slice(1).trim()}if(star)c.a=c.o.length;c.o.push(v);continue}

if(!c||(c.o.length>=2&&c.a!==null)){c={q:l,o:[],a:null};o.push(c)}
else if(c.o.length)c.o[c.o.length-1]+=' '+l;else c.q+=' '+l}
return o.map(c=>({q:c.q,o:c.o,a:(c.a!==null&&c.a<c.o.length)?c.a:null,t:c.o.length>=2?'t':'y'}))}
