const LET={A:0,B:1,C:2,D:3,E:4,'А':0,'Б':1,'В':2,'Г':3,'Д':4};

function slot(i){const d=dr().sl[i],t=(d.t||'').trim();if(!t)return null;if(i>=NT)return{t:'y',q:t.replace(/^\d+\s*[\.\)\-]\s*/,''),o:[],a:null};const c=parseSlot(t);if(!c.q&&!c.o.length)return null;let a=d.a!==''?+d.a:c.a;if(a!==null&&a>=c.o.length)a=null;return{t:c.o.length>=2?'t':'y',q:c.q,o:c.o,a,fb:c.fb,nl:t.split(/\n+/).filter(x=>x.trim()).length}}

const OPTR=/^([A-EА-ГДa-eа-гд])(?:\s*[\)\.\]:]|\t)\s*(.*)$/,ANSR=/^(?:javob|to'?g'?ri javob|answer|жавоб|тўғри жавоб|тугри жавоб|ответ)\s*(?:[:\-\u2013]\s*([A-EА-ГДa-eа-гд])|\s+([A-EА-ГДa-eа-гд])\s*[\)\.]?\s*$)/i,LTR='A-EА-ГДa-eа-гд';
function parseSlot(t){const L=t.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean);let q=[],o=[],a=null,m;
for(let l of L){if(m=l.match(ANSR)){a=LET[(m[1]||m[2]).toUpperCase()];continue}
let star=false;if(new RegExp('^[*+]\\s*['+LTR+']\\s*[\\)\\.\\]]').test(l)){star=true;l=l.replace(/^[*+]\s*/,'')}
m=l.match(OPTR);if(m&&LET[m[1].toUpperCase()]===o.length){let v=m[2];if(/^[*+]/.test(v)){star=true;v=v.slice(1).trim()}if(star)a=o.length;o.push(v);continue}

if(o.length<2){const full=L.filter(l=>!ANSR.test(l)).join(' '),re=/(?:^|\s)([A-DА-Г])\s*[\)\.]\s*/g,pos=[];let mm,exp=0;while(mm=re.exec(full)){if(LET[mm[1].toUpperCase()]===exp){pos.push({i:mm.index,e:re.lastIndex});exp++}}
if(pos.length>=2){q=[full.slice(0,pos[0].i).trim()];o=pos.map((x,k)=>full.slice(x.e,k+1<pos.length?pos[k+1].i:full.length).trim())}}
let fb=false;if(o.length<2){const L2=L.filter(l=>!ANSR.test(l));if(L2.length>=5){const tail=L2.slice(-4);q=L2.slice(0,-4);o=tail.map((l,k)=>{if(/^[*+]/.test(l)){a=k;l=l.slice(1).trim()}return l.replace(/^[A-EА-ГДa-eа-гд]\s*[\)\.\]:]\s*/,'').replace(/^[A-EА-ГДa-eа-гд]\t\s*/,'')});fb=true}}
const qt=q.join('\n').replace(/^\s*\d+\s*[\.\)\-]\s*/,'').trim();return{q:qt,o,a,fb}}
function parse(t,mode){
const L=t.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean),o=[];let c=null,m;
const OPT=/^([A-EА-ГДa-eа-гд])\s*[\)\.\]]\s*(.*)$/,ANS=/^(?:javob|javob|to'?g'?ri javob|answer|жавоб|тўғри жавоб|тугри жавоб|ответ)\s*[:\-\u2013]\s*([A-EА-ГДa-eа-гд])/i,NUM=/^\d+\s*[\.\)\-]\s*(.+)$/;
if(mode=='y'){const nm=L.some(l=>NUM.test(l));for(const l of L){if(m=l.match(NUM))o.push({q:m[1],o:[],a:null,t:'y'});else if(nm&&o.length)o[o.length-1].q+=' '+l;else o.push({q:l,o:[],a:null,t:'y'})}return o}
for(let l of L){
if(m=l.match(ANS)){if(c)c.a=LET[m[1].toUpperCase()];continue}
let star=false;if(/^[*+]\s*[A-EА-ГДa-eа-гд]\s*[\)\.\]]/.test(l)){star=true;l=l.replace(/^[*+]\s*/,'')}
if(c&&(m=l.match(OPT))){let v=m[2];if(/^[*+]/.test(v)){star=true;v=v.slice(1).trim()}if(star)c.a=c.o.length;c.o.push(v);continue}
if(m=l.match(NUM)){c={q:m[1],o:[],a:null};o.push(c);continue}
if(!c||(c.o.length>=2&&c.a!==null)){c={q:l,o:[],a:null};o.push(c)}
else if(c.o.length)c.o[c.o.length-1]+=' '+l;else c.q+=' '+l}
return o.map(c=>({q:c.q,o:c.o,a:(c.a!==null&&c.a<c.o.length)?c.a:null,t:c.o.length>=2?'t':'y'}))}
